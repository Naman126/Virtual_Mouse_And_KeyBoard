apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-mouse-keyboard
  labels:
    app: virtual-mouse-keyboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual-mouse-keyboard
  template:
    metadata:
      labels:
        app: virtual-mouse-keyboard
    spec:
      containers:
        - name: virtual-mouse-keyboard
          image: docker.io/DOCKERHUB_USERNAME/virtual-mouse-keyboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
